[project]
name = "codemarket"
version = "1.0.0"
description = "CodeMarket вЂ” РІРµР±-РїСЂРёР»РѕР¶РµРЅРёРµ РґР»СЏ РїСЂРѕРґР°Р¶Рё С†РёС„СЂРѕРІС‹С… РїСЂРѕРґСѓРєС‚РѕРІ (РєСѓСЂСЃРѕРІР°СЏ СЂР°Р±РѕС‚Р°)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", "fixtures/demo/repos", "fixtures/plag_pairs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["DJ001", "B904", "E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
