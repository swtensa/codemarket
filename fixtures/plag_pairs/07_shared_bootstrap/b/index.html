<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фитнес-студия «Пульс»</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page">
  <div class="topbar">
    <span class="topbar__brand">ПУЛЬС</span>
    <button class="topbar__burger" aria-label="Меню" onclick="document.body.classList.toggle('nav-open')">☰</button>
  </div>
  <aside class="drawer">
    <ul class="drawer__list">
      <li class="drawer__item"><a class="drawer__link" href="#schedule">Расписание</a></li>
      <li class="drawer__item"><a class="drawer__link" href="#trainers">Тренеры</a></li>
      <li class="drawer__item"><a class="drawer__link" href="#prices">Абонементы</a></li>
    </ul>
  </aside>
  <main>
    <div class="banner">
      <div class="banner__inner">
        <span class="banner__label">Первая тренировка бесплатно</span>
        <h1 class="banner__heading">Тренируйся с удовольствием</h1>
        <button class="button button--accent" data-open="signup">Записаться</button>
      </div>
    </div>
    <table id="schedule" class="timetable">
      <caption class="timetable__caption">Расписание на неделю</caption>
      <thead><tr><th>День</th><th>Утро</th><th>Вечер</th></tr></thead>
      <tbody>
        <tr><td>Пн</td><td>Йога 8:00</td><td>Кроссфит 19:00</td></tr>
        <tr><td>Ср</td><td>Пилатес 9:00</td><td>Бокс 20:00</td></tr>
        <tr><td>Пт</td><td>Стретчинг 8:30</td><td>Танцы 19:30</td></tr>
      </tbody>
    </table>
    <div id="trainers" class="people">
      <figure class="person"><img class="person__img" src="img/t1.jpg" alt=""><figcaption class="person__name">Анна, йога</figcaption></figure>
      <figure class="person"><img class="person__img" src="img/t2.jpg" alt=""><figcaption class="person__name">Игорь, бокс</figcaption></figure>
    </div>
    <dl id="prices" class="tariffs">
      <dt class="tariffs__name">Разовое</dt><dd class="tariffs__price">600 ₽</dd>
      <dt class="tariffs__name">8 занятий</dt><dd class="tariffs__price">3 900 ₽</dd>
      <dt class="tariffs__name">Безлимит</dt><dd class="tariffs__price">5 500 ₽</dd>
    </dl>
  </main>
  <dialog id="signup" class="modal">
    <form method="dialog" class="modal__form">
      <label class="modal__label">Имя <input class="modal__input" name="name"></label>
      <label class="modal__label">Телефон <input class="modal__input" name="phone" type="tel"></label>
      <button class="button">Отправить</button>
    </form>
  </dialog>
</body>
</html>
